# model_selection:
  module_0:
    class: KNeighborsClassifier
    module: sklearn.neighbors

    search_space:
      n_neighbors:
        type: int
        low: 3
        high: 15
        step: 2

      weights:
        type: categorical
        choices:
          - uniform
          - distance

      algorithm:
        type: categorical
        choices:
          - auto
          - ball_tree
          - kd_tree
          - brute

  module_1:
    class: RandomForestClassifier
    module: sklearn.ensemble

    search_space:
      n_estimators:
        type: int
        low: 50
        high: 300
        step: 50

      max_depth:
        type: int
        low: 5
        high: 30

      max_features:
        type: categorical
        choices:
          - sqrt
          - log2